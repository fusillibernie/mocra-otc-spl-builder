[project]
name = "mocra-otc-spl-builder"
version = "0.0.1"
description = "Builds and validates FDA SPL for our own brands: MoCRA cosmetic facility registration and product listing, OTC drug listing"
readme = "README.md"
requires-python = ">=3.11"
# fragrance-reg-core (US ingredient lists) gets added when the adapter is written.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocra_otc_spl_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
