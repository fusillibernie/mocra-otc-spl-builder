[project]
name = "mocra-otc-spl-builder"
version = "0.0.1"
description = "Builds and validates FDA SPL for our own brands: MoCRA cosmetic facility registration and product listing, OTC drug listing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fragrance-reg-core @ git+https://github.com/fusillibernie/fragrance-reg-core@v0.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mocra_otc_spl_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
